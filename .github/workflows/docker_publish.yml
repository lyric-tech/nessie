name: Build and Publish Custom Nessie Image

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag (e.g. 0.104.3-custom-v1)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Build Quarkus fast-jar
        run: ./gradlew :nessie-quarkus:quarkusBuild

      - name: Verify custom module is bundled
        run: |
          if ! find servers/quarkus-server/build/quarkus-app -name "*custom*" | grep -q .; then
            echo "ERROR: Custom Kafka JSON module not found in build output"
            exit 1
          fi
          echo "Custom module found:"
          find servers/quarkus-server/build/quarkus-app -name "*custom*"

      # --- Registry Logins ---

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: lyricacr.azurecr.io
          username: ${{ secrets.ACR_SP_USERNAME }}
          password: ${{ secrets.ACR_SP_PASSWORD }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Create ECR repository if needed
        env:
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          AWS_ACCOUNT_ID=$(echo ${ECR_REGISTRY} | cut -d'.' -f1)
          aws ecr describe-repositories \
            --repository-names nessie \
            --registry-id ${AWS_ACCOUNT_ID} \
            --region ${AWS_REGION} || \
          aws ecr create-repository \
            --repository-name nessie \
            --registry-id ${AWS_ACCOUNT_ID} \
            --region ${AWS_REGION} \
            --image-scanning-configuration scanOnPush=false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # --- Build and Push ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to all registries
        uses: docker/build-push-action@v6
        with:
          context: servers/quarkus-server
          file: tools/dockerbuild/docker/Dockerfile-server
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            lyricacr.azurecr.io/nessie:${{ inputs.image-tag }}
            ${{ secrets.ECR_REGISTRY }}/nessie:${{ inputs.image-tag }}
            ${{ secrets.GCR_REGISTRY }}/lyric/nessie:${{ inputs.image-tag }}
