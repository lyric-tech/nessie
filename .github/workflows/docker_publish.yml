name: Build and Publish Custom Nessie Image

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag (e.g. 0.104.3-custom-v1)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Build Quarkus fast-jar
        run: ./gradlew :nessie-quarkus:quarkusBuild

      - name: Verify custom module is bundled
        run: |
          if ! find servers/quarkus-server/build/quarkus-app -name "*custom*" | grep -q .; then
            echo "ERROR: Custom Kafka JSON module not found in build output"
            exit 1
          fi
          echo "Custom module found:"
          find servers/quarkus-server/build/quarkus-app -name "*custom*"

      - name: Login via Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_SP_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: lyricacr.azurecr.io
          username: ${{ secrets.ACR_SP_USERNAME }}
          password: ${{ secrets.ACR_SP_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: servers/quarkus-server
          file: tools/dockerbuild/docker/Dockerfile-server
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            lyricacr.azurecr.io/nessie:${{ inputs.image-tag }}
